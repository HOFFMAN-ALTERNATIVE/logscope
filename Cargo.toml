[package]
name = "logscope"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Fast CLI to tail, filter and aggregate structured logs (JSON, logfmt, nginx)"
license = "MIT"
authors = ["Herman Hoffman"]
repository = "https://github.com/HOFFMAN-ALTERNATIVE/logscope"
readme = "README.md"
keywords = ["logs", "cli", "json", "logfmt", "nginx"]
categories = ["command-line-utilities", "parsing"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
